<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f3ed">
    <title>Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="../app.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar site-navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M8 7h8M8 11h6" stroke="currentColor" stroke-linecap="round" stroke-width="1.6"/></svg>
                </span>
                Student System
            </a>
            <a class="nav-link ms-auto" href="login.html">Login</a>
        </div>
    </nav>
    <main class="container page-shell">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7 col-xl-6">
                <section class="card surface-card auth-card">
                    <div class="card-body">
                        <p class="eyebrow">Get started</p>
                        <h1 class="section-title mb-2">Create account</h1>
                        <p class="text-secondary mb-4">Enter your details to create an account.</p>
        <form id="register-form" action="http://localhost:8081/student-registration-system/api/User_Authentication/register.php" method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control"
                    type="text"
                    id="username"
                    name="username"
                    minlength="3"
                    maxlength="50"
                    pattern="[A-Za-z0-9_]{3,50}"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label" for="email">Email</label>
                <input class="form-control"
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control"
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="mb-4">
                <label class="form-label" for="password-confirmation">Confirm password</label>
                <input class="form-control"
                    type="password"
                    id="password-confirmation"
                    name="password_confirmation"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button class="btn btn-primary btn-lg w-100" type="submit">Create account</button>
        </form>

        <p id="form-message" class="alert alert-info status-message mt-3 mb-0" role="status" aria-live="polite"></p>
        <p class="text-secondary text-center mt-4 mb-0">Already have an account? <a href="login.html">Login</a></p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('register-form');
        const password = document.getElementById('password');
        const passwordConfirmation = document.getElementById('password-confirmation');
        const message = document.getElementById('form-message');

        function validatePasswordConfirmation() {
            if (passwordConfirmation.value !== password.value) {
                passwordConfirmation.setCustomValidity('Passwords do not match.');
            } else {
                passwordConfirmation.setCustomValidity('');
            }
        }

        password.addEventListener('input', validatePasswordConfirmation);
        passwordConfirmation.addEventListener('input', validatePasswordConfirmation);

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            validatePasswordConfirmation();

            if (!form.reportValidity()) {
                return;
            }

            message.textContent = 'Creating your account...';

            let response;

            try {
                response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form)
                });
            } catch (error) {
                message.textContent = `Could not connect to the API: ${error.message}`;
                return;
            }

            const responseText = await response.text();
            let result;

            try {
                result = JSON.parse(responseText);
            } catch (error) {
                message.textContent = `The server returned an unexpected response (HTTP ${response.status}). Make sure this page is opened through the same XAMPP server as the API.`;
                return;
            }

            if (response.ok && result.success) {
                message.textContent = result.message || 'Account created successfully.';
                form.reset();
                passwordConfirmation.setCustomValidity('');
                window.location.assign(new URL('login.html?registered=1', window.location.href));
            } else {
                message.textContent = result.message || `Could not create the account (HTTP ${response.status}).`;
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
