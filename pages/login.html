<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f3ed">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="../app.css" rel="stylesheet">
    <script src="../app.js" defer></script>
</head>
<body>
    <nav class="navbar site-navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"/><path d="M8 7h8M8 11h6" stroke="currentColor" stroke-linecap="round" stroke-width="1.6"/></svg>
                </span>
                Student System
            </a>
            <a class="nav-link ms-auto" href="register.html">Create account</a>
        </div>
    </nav>
    <main class="container page-shell">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7 col-xl-6">
                <section class="card surface-card auth-card">
                    <div class="card-body">
                        <p class="eyebrow">Welcome back</p>
                        <h1 class="section-title mb-2">Login</h1>
                        <p class="text-secondary mb-4">Sign in with your username or email.</p>

        <p id="registration-message" class="alert alert-success status-message" role="status" aria-live="polite"></p>

        <form
            id="login-form"
            action="http://localhost:8081/student-registration-system/api/User_Authentication/login.php"
            method="post"
        >
            <div class="mb-3">
                <label class="form-label" for="identifier">Username or email</label>
                <input class="form-control"
                    type="text"
                    id="identifier"
                    name="username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input class="form-control"
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button class="btn btn-primary btn-lg w-100" type="submit">Login</button>
        </form>

        <p id="form-message" class="alert alert-info status-message mt-3 mb-0" role="status" aria-live="polite"></p>
        <p class="text-secondary text-center mt-4 mb-0">New here? <a href="register.html">Create an account</a></p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('login-form');
        const message = document.getElementById('form-message');
        const registrationMessage = document.getElementById('registration-message');

        if (new URLSearchParams(window.location.search).get('registered') === '1') {
            registrationMessage.textContent = 'Account created successfully. You can now log in.';
        }
        if (new URLSearchParams(window.location.search).get('required') === '1') {
            registrationMessage.textContent = 'Please log in to access student records.';
        }

        const apiHost = window.location.hostname || 'localhost';
        const loginApiUrl = window.location.port === '8081'
            ? new URL('../api/User_Authentication/login.php', window.location.href)
            : new URL(`http://${apiHost}:8081/student-registration-system/api/User_Authentication/login.php`);
        form.action = loginApiUrl.href;

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            if (!form.reportValidity()) {
                return;
            }

            message.textContent = 'Logging in...';

            let response;

            try {
                response = await fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    credentials: 'include'
                });
            } catch (error) {
                message.textContent = `Could not connect to the login API at ${form.action}: ${error.message}. Open this page through XAMPP at http://localhost:8081/student-registration-system/pages/login.html.`;
                return;
            }

            const responseText = await response.text();
            let result;

            try {
                result = JSON.parse(responseText);
            } catch (error) {
                message.textContent = `The server returned an unexpected response (HTTP ${response.status}).`;
                return;
            }

            if (response.ok && result.success) {
                window.location.assign(new URL('index.html', window.location.href));
            } else {
                message.textContent = result.message || `Login failed (HTTP ${response.status}).`;
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
